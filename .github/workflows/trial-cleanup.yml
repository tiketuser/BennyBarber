# Deletes the own sites (<siteId>.web.app) of trials that ended a week ago and didn't graduate, to stay under Firebase's
# 36 sites per project. Their <main site>/<slug> address keeps working. "Create trial shop" also runs this first.
# The daily schedule only runs from the repository's default branch; run it by hand from Actions otherwise.
name: Trial sites cleanup

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check the deploy key is set
        id: key
        run: echo "present=${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.key.outputs.present == 'true'
        uses: actions/checkout@v4
      - if: steps.key.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.key.outputs.present == 'true'
        run: npm ci
      - if: steps.key.outputs.present == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          node --experimental-strip-types --no-warnings scripts/trial-sites.mjs cleanup
